  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { 
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            grotesk: ['"Space Grotesk"', 'sans-serif'],
            syne: ['"Syne"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            unbounded: ['"Unbounded"', 'sans-serif'],
            orbitron: ['"Orbitron"', 'sans-serif'],
            outfit: ['"Outfit"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            background: '#0b0e17',
            surface: '#111624',
            surfaceHighlight: '#182032',
            border: 'rgba(255, 255, 255, 0.08)',
            primary: '#8b5cf6',
            accent: '#6366f1',
            cyanAccent: '#38bdf8',
            goldAccent: '#a855f7',
            muted: '#a1a1aa',
            success: '#10b981',
            danger: '#f43f5e',
            purpleAccent: '#8b5cf6'
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'marquee': 'marquee 25s linear infinite',
            'aurora': 'aurora 20s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'particle': 'particle 15s ease-in-out infinite',
            'pulse-slow': 'pulseSlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(40px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            marquee: { '0%': { transform: 'translateX(80vw)' }, '100%': { transform: 'translateX(-100%)' } },
            aurora: { '0%': { backgroundPosition: '0% 50%' }, '50%': { backgroundPosition: '100% 50%' }, '100%': { backgroundPosition: '0% 50%' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            particle: { 
              '0%, 100%': { transform: 'translate(0, 0)' }, 
              '25%': { transform: 'translate(30px, -30px)' }, 
              '50%': { transform: 'translate(-20px, -50px)' }, 
              '75%': { transform: 'translate(-40px, 20px)' } 
            },
            pulseSlow: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.5' } }
          }
        }
      }
    }
  </script>
